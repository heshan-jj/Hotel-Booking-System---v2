<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (iOS Sapphire Blue) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a84ff" />
      <stop offset="50%" stop-color="#0071e3" />
      <stop offset="100%" stop-color="#0056b3" />
    </linearGradient>

    <!-- Subtle Bevel Highlight Gradient -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="15%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Window Glow / Soft Fill -->
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#e1f0ff" stop-opacity="0.85" />
    </linearGradient>

    <!-- Star Glow Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe600" />
      <stop offset="100%" stop-color="#ffb703" />
    </linearGradient>

    <!-- Soft Drop Shadow for Buildings -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#002b5c" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- iOS Squircle Base -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />

  <!-- Glass Top Bevel Highlight -->
  <rect width="512" height="512" rx="116" fill="url(#highlightGrad)" />

  <!-- Inner Hairline Border -->
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.25" />

  <!-- Hotel Icon Graphic with Drop Shadow -->
  <g filter="url(#shadow)">
    <!-- Central Main Hotel Tower -->
    <path
      d="M176 148 C176 136, 185 126, 198 126 L314 126 C327 126, 336 136, 336 148 L336 416 L176 416 Z"
      fill="#ffffff"
    />

    <!-- Left Wing -->
    <path
      d="M96 220 C96 208, 105 200, 116 200 L176 200 L176 416 L96 416 Z"
      fill="#edf4fc"
    />

    <!-- Right Wing -->
    <path
      d="M336 200 L396 200 C407 200, 416 208, 416 220 L416 416 L336 416 Z"
      fill="#edf4fc"
    />

    <!-- Canopy / Roof Accent -->
    <path
      d="M188 126 L256 78 L324 126 Z"
      fill="#ffffff"
    />

    <!-- Hospitality 5-Star Emblem above Hotel -->
    <path
      d="M256 36 L263.2 55.4 L283.8 56.1 L267.7 69.1 L273.2 89.1 L256 77.2 L238.8 89.1 L244.3 69.1 L228.2 56.1 L248.8 55.4 Z"
      fill="url(#starGrad)"
    />

    <!-- Left Wing Windows (3 rows) -->
    <rect x="122" y="232" width="28" height="34" rx="6" fill="#0071e3" fill-opacity="0.85" />
    <rect x="122" y="290" width="28" height="34" rx="6" fill="#0071e3" fill-opacity="0.85" />
    <rect x="122" y="348" width="28" height="34" rx="6" fill="#0071e3" fill-opacity="0.85" />

    <!-- Right Wing Windows (3 rows) -->
    <rect x="362" y="232" width="28" height="34" rx="6" fill="#0071e3" fill-opacity="0.85" />
    <rect x="362" y="290" width="28" height="34" rx="6" fill="#0071e3" fill-opacity="0.85" />
    <rect x="362" y="348" width="28" height="34" rx="6" fill="#0071e3" fill-opacity="0.85" />

    <!-- Main Tower Windows (Left Column) -->
    <rect x="206" y="162" width="34" height="38" rx="7" fill="#0071e3" fill-opacity="0.9" />
    <rect x="206" y="222" width="34" height="38" rx="7" fill="#0071e3" fill-opacity="0.9" />
    <rect x="206" y="282" width="34" height="38" rx="7" fill="#0071e3" fill-opacity="0.9" />

    <!-- Main Tower Windows (Right Column) -->
    <rect x="272" y="162" width="34" height="38" rx="7" fill="#0071e3" fill-opacity="0.9" />
    <rect x="272" y="222" width="34" height="38" rx="7" fill="#0071e3" fill-opacity="0.9" />
    <rect x="272" y="282" width="34" height="38" rx="7" fill="#0071e3" fill-opacity="0.9" />

    <!-- Grand Entrance Doorway with Rounded Arch -->
    <path
      d="M228 416 L228 358 C228 344, 240 334, 256 334 C272 334, 284 344, 284 358 L284 416 Z"
      fill="#005bb5"
    />

    <!-- Entrance Awning / Portico -->
    <path
      d="M216 352 L296 352 L288 342 L224 342 Z"
      fill="#ffb703"
    />

    <!-- Foundation Ground Line -->
    <rect x="80" y="414" width="352" height="10" rx="5" fill="#ffffff" fill-opacity="0.8" />
  </g>
</svg>